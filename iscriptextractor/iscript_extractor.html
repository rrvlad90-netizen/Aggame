<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IceCC Web</title>
<style>
  * { box-sizing: border-box }
  body {
    margin: 0;
    background: #111827;
    color: #e5e7eb;
    font: 14px Arial, sans-serif;
  }
  header {
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 12px;
    background: #1f2937;
  }
  button, .file-button {
    border: 0;
    border-radius: 5px;
    padding: 9px 14px;
    background: #2563eb;
    color: white;
    cursor: pointer;
  }
  button:hover, .file-button:hover { background: #1d4ed8 }
  input[type=file] { display: none }
  #status { margin-left: auto; color: #9ca3af }
  textarea {
    display: block;
    width: 100%;
    height: calc(100vh - 61px);
    border: 0;
    resize: none;
    outline: none;
    padding: 16px;
    background: #0b1020;
    color: #d1fae5;
    font: 14px/1.45 Consolas, monospace;
    tab-size: 4;
  }
  .error { color: #f87171 !important }
  .success { color: #34d399 !important }
</style>
</head>
<body>

<header>
  <label class="file-button">
    Открыть iscript.bin
    <input id="fileInput" type="file" accept=".bin">
  </label>
  <button id="compileButton">Скомпилировать</button>
  <button id="clearButton">Очистить</button>
  <span id="status">IceCC Web — чистый JavaScript</span>
</header>

<textarea id="editor" spellcheck="false"
  placeholder="Загрузите iscript.bin или вставьте IceCC-скрипт сюда"></textarea>

<script>
/*
 * IceCC Web
 * Pure JavaScript iscript.bin compiler/decompiler.
 * Derived from IceCC concepts. Distribute under GPL-2.0-or-later.
 */

"use strict";

const HEADER_TYPES = [
  2, 2, 4, 0, 0, 0, 0, 0,
  0, 0, 0, 0, 14, 14, 16, 16,
  0, 0, 0, 0, 22, 22, 0, 24,
  26, 28, 28, 28, 0, 0, 0, 0
];

const ANIMATIONS = [
  "Init", "Death", "GndAttkInit", "AirAttkInit",
  "Unused1", "GndAttkRpt", "AirAttkRpt", "CastSpell",
  "GndAttkToIdle", "AirAttkToIdle", "Unused2", "Walking",
  "WalkingToIdle", "SpecialState1", "SpecialState2", "AlmostBuilt",
  "Built", "Landing", "LiftOff", "IsWorking",
  "WorkingToIdle", "WarpIn", "Unused3", "StarEditInit",
  "Disable", "Burrow", "UnBurrow", "Enable"
];

const CLASSIC_ANIMATIONS = [
  "Init", "Death", "GndAttkInit", "AirAttkInit",
  "SpAbility1", "GndAttkRpt", "AirAttkRpt", "SpAbility2",
  "GndAttkToIdle", "AirAttkToIdle", "SpAbility3", "Walking",
  "Other", "BurrowInit", "ConstrctHarvst", "IsWorking",
  "Landing", "LiftOff", "Unknown18", "Unknown19",
  "Unknown20", "Unknown21", "Unknown22", "Unknown23",
  "Unknown24", "Burrow", "UnBurrow", "Unknown27"
];

/*
 * Argument formats:
 * b   = unsigned byte
 * w   = unsigned 16-bit word
 * var = first byte specifies number of following words
 *
 * Types:
 * n = normal
 * j = unconditional jump
 * c = conditional jump
 * t = terminating instruction
 */
const DEFINITIONS = [
  ["playfram",          "n", ["w"]],
  ["playframtile",      "n", ["w"]],
  ["sethorpos",         "n", ["b"]],
  ["setvertpos",        "n", ["b"]],
  ["setpos",            "n", ["b","b"]],
  ["wait",              "n", ["b"]],
  ["waitrand",          "n", ["b","b"]],
  ["goto",              "j", ["w"]],
  ["imgol",             "n", ["w","b","b"]],
  ["imgul",             "n", ["w","b","b"]],
  ["imgolorig",         "n", ["w"]],
  ["switchul",          "n", ["w"]],
  ["__0c",              "n", []],
  ["imgoluselo",        "n", ["w","b","b"]],
  ["imguluselo",        "n", ["w","b","b"]],
  ["sprol",             "n", ["w","b","b"]],
  ["highsprol",         "n", ["w","b","b"]],
  ["lowsprul",          "n", ["w","b","b"]],
  ["uflunstable",       "n", ["w"]],
  ["spruluselo",        "n", ["w","b","b"]],
  ["sprul",             "n", ["w","b","b"]],
  ["sproluselo",        "n", ["w","b"]],
  ["end",               "t", []],
  ["setflipstate",      "n", ["b"]],
  ["playsnd",           "n", ["w"]],
  ["playsndrand",       "n", ["var"]],
  ["playsndbtwn",       "n", ["w","w"]],
  ["domissiledmg",      "n", []],
  ["attackmelee",       "n", ["var"]],
  ["followmaingraphic", "n", []],
  ["randcondjmp",       "c", ["b","w"]],
  ["turnccwise",        "n", ["b"]],
  ["turncwise",         "n", ["b"]],
  ["turn1cwise",        "n", []],
  ["turnrand",          "n", ["b"]],
  ["setspawnframe",     "n", ["b"]],
  ["sigorder",          "n", ["b"]],
  ["attackwith",        "n", ["b"]],
  ["attack",            "n", []],
  ["castspell",         "n", []],
  ["useweapon",         "n", ["b"]],
  ["move",              "n", ["b"]],
  ["gotorepeatattk",    "n", []],
  ["engframe",          "n", ["b"]],
  ["engset",            "n", ["b"]],
  ["__2d",              "n", []],
  ["nobrkcodestart",    "n", []],
  ["nobrkcodeend",      "n", []],
  ["ignorerest",        "n", []],
  ["attkshiftproj",     "n", ["b"]],
  ["tmprmgraphicstart", "n", []],
  ["tmprmgraphicend",   "n", []],
  ["setfldirect",       "n", ["b"]],
  ["call",              "c", ["w"]],
  ["return",            "t", []],
  ["setflspeed",        "n", ["w"]],
  ["creategasoverlays", "n", ["b"]],
  ["pwrupcondjmp",      "c", ["w"]],
  ["trgtrangecondjmp",  "c", ["w","w"]],
  ["trgtarccondjmp",    "c", ["w","w","w"]],
  ["curdirectcondjmp",  "c", ["w","w","w"]],
  ["imgulnextid",       "n", ["b","b"]],
  ["__3e",              "n", []],
  ["liftoffcondjmp",    "c", ["w"]],
  ["warpoverlay",       "n", ["w"]],
  ["orderdone",         "n", ["b"]],
  ["grdsprol",          "n", ["w","b","b"]],
  ["__43",              "n", []],
  ["dogrddamage",       "n", []]
];

const CLASSIC_NAMES = [
  "playfram", "playframfile", "__02", "shvertpos", "__04",
  "wait", "waitrand", "goto", "imgol08", "imgul09",
  "imgol0a", "switchul", "__0c", "imgol0d", "imgol0e",
  "sprol0f", "sprol10", "sprul11", "__12", "sprol13",
  "sprol14", "sprol15", "end", "__17", "playsnd",
  "playsndrand", "playsndbtwn", "domissiledmg", "attack1c",
  "followmaingraphic", "__1e_condjmp", "turnccwise", "turncwise",
  "turn1cwise", "turnrand", "__23", "sigorder", "attack25",
  "attack26", "castspell", "useweapon", "move", "gotorepeatattk",
  "__2b", "__2c", "__2d", "nobrkcodestart", "nobrkcodeend",
  "ignorerest", "attkprojangle", "tmprmgraphicstart",
  "tmprmgraphicend", "playframno", "__35_condjmp", "__36",
  "__37", "__38", "pwrupcondjmp", "trgtrangecondjmp",
  "trgtarccondjmp", "__3c_condjmp", "__3d", "__3e",
  "__3f_condjmp", "__40", "__41", "sprol42", "__43", "__44"
];

const OPCODES = DEFINITIONS.map((entry, opcode) => ({
  opcode,
  name: entry[0],
  type: entry[1],
  format: entry[2]
}));

const OPCODE_BY_NAME = new Map();

for (const instruction of OPCODES) {
  OPCODE_BY_NAME.set(instruction.name.toLowerCase(), instruction);
}

for (let opcode = 0; opcode < CLASSIC_NAMES.length; opcode++) {
  OPCODE_BY_NAME.set(CLASSIC_NAMES[opcode].toLowerCase(), OPCODES[opcode]);
}

const ANIMATION_INDEX = new Map();

for (let i = 0; i < ANIMATIONS.length; i++) {
  ANIMATION_INDEX.set(ANIMATIONS[i].toLowerCase(), i);
  ANIMATION_INDEX.set(CLASSIC_ANIMATIONS[i].toLowerCase(), i);
}

class IscriptError extends Error {
  constructor(message, line = null) {
    super(line === null ? message : `Строка ${line}: ${message}`);
  }
}

class BinaryReader {
  constructor(buffer) {
    this.bytes = new Uint8Array(buffer);
    this.view = new DataView(buffer);
  }

  check(offset, length = 1) {
    if (offset < 0 || offset + length > this.bytes.length) {
      throw new IscriptError(
        `Выход за границы файла: 0x${offset.toString(16)}`
      );
    }
  }

  u8(offset) {
    this.check(offset);
    return this.view.getUint8(offset);
  }

  u16(offset) {
    this.check(offset, 2);
    return this.view.getUint16(offset, true);
  }

  ascii(offset, length) {
    this.check(offset, length);
    return String.fromCharCode(...this.bytes.slice(offset, offset + length));
  }
}

class BinaryWriter {
  constructor() {
    this.data = [];
  }

  get length() {
    return this.data.length;
  }

  u8(value) {
    this.data.push(value & 0xff);
  }

  u16(value) {
    this.data.push(value & 0xff, (value >>> 8) & 0xff);
  }

  ascii(value) {
    for (const character of value) {
      this.u8(character.charCodeAt(0));
    }
  }

  zero(count) {
    while (count-- > 0) this.u8(0);
  }

  align2() {
    if (this.length & 1) this.u8(0);
  }

  patchU16(offset, value) {
    this.data[offset] = value & 0xff;
    this.data[offset + 1] = (value >>> 8) & 0xff;
  }

  finish() {
    return new Uint8Array(this.data);
  }
}

function hexadecimal(value, size = 4) {
  return value.toString(16).toUpperCase().padStart(size, "0");
}

function instructionSize(instruction) {
  let size = 1;

  if (instruction.format[0] === "var") {
    const count = instruction.args[0];
    return size + 1 + count * 2;
  }

  for (const type of instruction.format) {
    size += type === "b" ? 1 : 2;
  }

  return size;
}

function readInstruction(reader, offset) {
  const opcode = reader.u8(offset);
  const definition = OPCODES[opcode];

  if (!definition) {
    throw new IscriptError(
      `Неизвестный opcode 0x${hexadecimal(opcode, 2)} по адресу ` +
      `0x${hexadecimal(offset)}`
    );
  }

  let position = offset + 1;
  const args = [];

  if (definition.format[0] === "var") {
    const count = reader.u8(position++);
    args.push(count);

    if (count > 64) {
      throw new IscriptError(
        `Слишком много аргументов по адресу 0x${hexadecimal(offset)}`
      );
    }

    for (let i = 0; i < count; i++) {
      args.push(reader.u16(position));
      position += 2;
    }
  } else {
    for (const type of definition.format) {
      if (type === "b") {
        args.push(reader.u8(position++));
      } else {
        args.push(reader.u16(position));
        position += 2;
      }
    }
  }

  return {
    ...definition,
    args,
    offset,
    size: position - offset
  };
}

function parseBinary(buffer) {
  const reader = new BinaryReader(buffer);

  if (reader.bytes.length < 8) {
    throw new IscriptError("Файл слишком маленький");
  }

  const tableOffset = reader.u16(0);

  if (tableOffset < 4 || tableOffset >= reader.bytes.length) {
    throw new IscriptError(
      `Некорректное смещение таблицы: 0x${hexadecimal(tableOffset)}`
    );
  }

  const headers = [];
  let position = tableOffset;
  const headerIds = new Set();

  while (true) {
    const id = reader.u16(position);
    position += 2;

    if (id === 0xffff) break;

    const offset = reader.u16(position);
    position += 2;

    if (headerIds.has(id)) {
      throw new IscriptError(`Повторяющийся IsId ${id}`);
    }

    headerIds.add(id);

    if (reader.ascii(offset, 4) !== "SCPE") {
      throw new IscriptError(
        `Заголовок IsId ${id} не содержит сигнатуру SCPE`
      );
    }

    const type = reader.u16(offset + 4);
    const animationCount = HEADER_TYPES[type];

    if (!animationCount) {
      throw new IscriptError(
        `Неизвестный тип заголовка ${type} у IsId ${id}`
      );
    }

    const animationOffsets = [];
    let animationPosition = offset + 8;

    for (let i = 0; i < animationCount; i++) {
      animationOffsets.push(reader.u16(animationPosition));
      animationPosition += 2;
    }

    headers.push({ id, type, offset, animationOffsets });
  }

  const instructions = new Map();
  const pending = [];

  for (const header of headers) {
    for (const offset of header.animationOffsets) {
      if (offset !== 0) pending.push(offset);
    }
  }

  while (pending.length) {
    let offset = pending.pop();

    while (offset && !instructions.has(offset)) {
      const instruction = readInstruction(reader, offset);
      instructions.set(offset, instruction);

      if (instruction.type === "j" || instruction.type === "c") {
        const target = instruction.args.at(-1);

        if (!target) {
          throw new IscriptError(
            `Нулевой переход по адресу 0x${hexadecimal(offset)}`
          );
        }

        pending.push(target);
      }

      if (instruction.type === "j" || instruction.type === "t") {
        break;
      }

      offset += instruction.size;
    }
  }

  return { headers, instructions };
}

function makeLabelMap(parsed) {
  const targets = new Set();

  for (const header of parsed.headers) {
    for (const offset of header.animationOffsets) {
      if (offset) targets.add(offset);
    }
  }

  for (const instruction of parsed.instructions.values()) {
    if (instruction.type === "j" || instruction.type === "c") {
      targets.add(instruction.args.at(-1));
    }
  }

  const labels = new Map();

  for (const offset of [...targets].sort((a, b) => a - b)) {
    labels.set(offset, `L_${hexadecimal(offset)}`);
  }

  return labels;
}

function decompile(buffer) {
  const parsed = parseBinary(buffer);
  const labels = makeLabelMap(parsed);
  const output = [
    "# Generated by IceCC Web",
    "# Pure JavaScript iscript.bin decompiler",
    ""
  ];

  for (const header of parsed.headers.sort((a, b) => a.id - b.id)) {
    output.push(".headerstart");
    output.push(`IsId           ${header.id}`);
    output.push(`Type           ${header.type}`);

    for (let i = 0; i < header.animationOffsets.length; i++) {
      const offset = header.animationOffsets[i];
      const name = ANIMATIONS[i] ?? `Animation${i}`;
      output.push(
        `${name.padEnd(15)}${offset ? labels.get(offset) : "[NONE]"}`
      );
    }

    output.push(".headerend", "");
  }

  const sortedInstructions = [...parsed.instructions.values()]
    .sort((a, b) => a.offset - b.offset);

  for (const instruction of sortedInstructions) {
    const label = labels.get(instruction.offset);

    if (label) output.push(`${label}:`);

    const args = instruction.args.map((value, index) => {
      const isJumpArgument =
        (instruction.type === "j" || instruction.type === "c") &&
        index === instruction.args.length - 1;

      return isJumpArgument ? labels.get(value) : String(value);
    });

    output.push(
      `\t${instruction.name.padEnd(20)}${args.join(" ")}`
        .trimEnd()
    );

    if (instruction.type === "j" || instruction.type === "t") {
      output.push("");
    }
  }

  return output.join("\n");
}

function parseNumber(value, line) {
  if (!/^(?:0x[0-9a-f]+|\d+)$/i.test(value)) {
    throw new IscriptError(`Некорректное число "${value}"`, line);
  }

  const number = Number(value);

  if (!Number.isInteger(number) || number < 0 || number > 0xffff) {
    throw new IscriptError(`Число вне диапазона: ${value}`, line);
  }

  return number;
}

function tokenizeSource(source) {
  return source.split(/\r?\n/).map((original, index) => {
    const text = original.replace(/#.*$/, "").trim();
    return { text, line: index + 1 };
  });
}

function parseSource(source) {
  const lines = tokenizeSource(source);
  const headers = [];
  const instructions = [];
  const labels = new Map();
  let currentHeader = null;

  for (const entry of lines) {
    let text = entry.text;
    if (!text) continue;

    if (text.toLowerCase() === ".headerstart") {
      if (currentHeader) {
        throw new IscriptError("Вложенный .headerstart", entry.line);
      }

      currentHeader = {
        id: null,
        type: null,
        animations: new Map(),
        line: entry.line
      };
      continue;
    }

    if (text.toLowerCase() === ".headerend") {
      if (!currentHeader) {
        throw new IscriptError(".headerend без .headerstart", entry.line);
      }

      if (currentHeader.id === null || currentHeader.type === null) {
        throw new IscriptError(
          "Заголовок должен содержать IsId и Type",
          currentHeader.line
        );
      }

      const animationCount = HEADER_TYPES[currentHeader.type];

      if (!animationCount) {
        throw new IscriptError(
          `Неподдерживаемый Type ${currentHeader.type}`,
          currentHeader.line
        );
      }

      headers.push(currentHeader);
      currentHeader = null;
      continue;
    }

    if (currentHeader) {
      const parts = text.split(/\s+/);
      const key = parts.shift();
      const value = parts.shift();

      if (!value) {
        throw new IscriptError(`Нет значения для ${key}`, entry.line);
      }

      if (key.toLowerCase() === "isid") {
        currentHeader.id = parseNumber(value, entry.line);
      } else if (key.toLowerCase() === "type") {
        currentHeader.type = parseNumber(value, entry.line);
      } else {
        const animationIndex = ANIMATION_INDEX.get(key.toLowerCase());

        if (animationIndex === undefined) {
          throw new IscriptError(
            `Неизвестная анимация "${key}"`,
            entry.line
          );
        }

        currentHeader.animations.set(
          animationIndex,
          value.toUpperCase() === "[NONE]" ? null : value
        );
      }

      continue;
    }

    while (true) {
      const labelMatch = text.match(/^([A-Za-z_][A-Za-z0-9_.]*)\s*:\s*(.*)$/);

      if (!labelMatch) break;

      const label = labelMatch[1];

      if (labels.has(label)) {
        throw new IscriptError(`Повторная метка "${label}"`, entry.line);
      }

      labels.set(label, instructions.length);
      text = labelMatch[2].trim();

      if (!text) break;
    }

    if (!text) continue;

    const tokens = text.split(/\s+/);
    const opcodeName = tokens.shift();
    const definition = OPCODE_BY_NAME.get(opcodeName.toLowerCase());

    if (!definition) {
      throw new IscriptError(
        `Неизвестная инструкция "${opcodeName}"`,
        entry.line
      );
    }

    const jump =
      definition.type === "j" || definition.type === "c";

    const expectedCount = definition.format[0] === "var"
      ? null
      : definition.format.length;

    if (expectedCount !== null && tokens.length !== expectedCount) {
      throw new IscriptError(
        `${opcodeName}: ожидалось аргументов ${expectedCount}, ` +
        `получено ${tokens.length}`,
        entry.line
      );
    }

    let jumpLabel = null;
    const numericTokens = [...tokens];

    if (jump) {
      jumpLabel = numericTokens.pop();

      if (!jumpLabel) {
        throw new IscriptError(
          `${opcodeName}: отсутствует метка перехода`,
          entry.line
        );
      }
    }

    const args = numericTokens.map(value => parseNumber(value, entry.line));

    if (definition.format[0] === "var") {
      if (!args.length || args.length !== args[0] + 1) {
        throw new IscriptError(
          `${opcodeName}: первый аргумент должен равняться ` +
          `числу следующих аргументов`,
          entry.line
        );
      }
    }

    instructions.push({
      ...definition,
      args,
      jumpLabel,
      line: entry.line
    });
  }

  if (currentHeader) {
    throw new IscriptError(
      "Не найден .headerend",
      currentHeader.line
    );
  }

  if (!headers.length) {
    throw new IscriptError("Не найдено ни одного заголовка");
  }

  if (!instructions.length) {
    throw new IscriptError("Не найдено ни одной инструкции");
  }

  const ids = new Set();

  for (const header of headers) {
    if (ids.has(header.id)) {
      throw new IscriptError(
        `Повторяющийся IsId ${header.id}`,
        header.line
      );
    }
    ids.add(header.id);
  }

  return { headers, instructions, labels };
}

function validateRange(value, type, line) {
  const maximum = type === "b" ? 0xff : 0xffff;

  if (value < 0 || value > maximum) {
    throw new IscriptError(
      `Аргумент ${value} не помещается в ${type === "b" ? "byte" : "uint16"}`,
      line
    );
  }
}

function compile(source) {
  const parsed = parseSource(source);
  const writer = new BinaryWriter();

  // Brood War compatibility area.
  writer.zero(0x558);
  writer.u16(0xffff);
  writer.u16(0);

  const headerRecords = [];

  for (const header of parsed.headers) {
    writer.align2();

    const offset = writer.length;
    writer.ascii("SCPE");
    writer.u16(header.type);
    writer.u16(0);

    const animationCount = HEADER_TYPES[header.type];
    const patches = [];

    for (let i = 0; i < animationCount; i++) {
      patches.push(writer.length);
      writer.u16(0);
    }

    headerRecords.push({ header, offset, patches });
  }

  writer.align2();

  const instructionOffsets = [];
  let codeOffset = writer.length;

  for (const instruction of parsed.instructions) {
    instructionOffsets.push(codeOffset);

    const completeInstruction = {
      ...instruction,
      args: instruction.jumpLabel
        ? [...instruction.args, 0]
        : [...instruction.args]
    };

    codeOffset += instructionSize(completeInstruction);
  }

  const labelOffsets = new Map();

  for (const [name, index] of parsed.labels) {
    if (index >= instructionOffsets.length) {
      throw new IscriptError(
        `Метка "${name}" не указывает на инструкцию`
      );
    }

    labelOffsets.set(name, instructionOffsets[index]);
  }

  for (const instruction of parsed.instructions) {
    writer.u8(instruction.opcode);

    const values = [...instruction.args];

    if (instruction.jumpLabel) {
      const target = labelOffsets.get(instruction.jumpLabel);

      if (target === undefined) {
        throw new IscriptError(
          `Не найдена метка "${instruction.jumpLabel}"`,
          instruction.line
        );
      }

      values.push(target);
    }

    let format;

    if (instruction.format[0] === "var") {
      format = ["b", ...Array(values[0]).fill("w")];
    } else {
      format = instruction.format;
    }

    if (values.length !== format.length) {
      throw new IscriptError(
        `Неверное количество аргументов у ${instruction.name}`,
        instruction.line
      );
    }

    for (let i = 0; i < values.length; i++) {
      validateRange(values[i], format[i], instruction.line);

      if (format[i] === "b") writer.u8(values[i]);
      else writer.u16(values[i]);
    }
  }

  for (const record of headerRecords) {
    const { header, patches } = record;
    const animationCount = HEADER_TYPES[header.type];

    for (let i = 0; i < animationCount; i++) {
      const label = header.animations.get(i);

      if (label === null || label === undefined) {
        writer.patchU16(patches[i], 0);
        continue;
      }

      const target = labelOffsets.get(label);

      if (target === undefined) {
        throw new IscriptError(
          `Заголовок IsId ${header.id}: метка "${label}" не найдена`,
          header.line
        );
      }

      writer.patchU16(patches[i], target);
    }
  }

  const tableOffset = writer.length;

  for (const record of headerRecords) {
    writer.u16(record.header.id);
    writer.u16(record.offset);
  }

  writer.u16(0xffff);
  writer.u16(0);

  if (writer.length > 0xffff) {
    throw new IscriptError(
      `Результат слишком большой: ${writer.length} байт; максимум 65535`
    );
  }

  writer.patchU16(0, tableOffset);
  return writer.finish();
}

function download(data, filename) {
  const blob = new Blob([data], {
    type: "application/octet-stream"
  });

  const url = URL.createObjectURL(blob);
  const anchor = document.createElement("a");
  anchor.href = url;
  anchor.download = filename;
  anchor.click();

  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

const editor = document.querySelector("#editor");
const status = document.querySelector("#status");
const fileInput = document.querySelector("#fileInput");
const compileButton = document.querySelector("#compileButton");
const clearButton = document.querySelector("#clearButton");

function setStatus(message, type = "") {
  status.textContent = message;
  status.className = type;
}

fileInput.addEventListener("change", async event => {
  const file = event.target.files[0];
  if (!file) return;

  try {
    setStatus("Декомпиляция...");
    const buffer = await file.arrayBuffer();
    editor.value = decompile(buffer);

    const parsed = parseBinary(buffer);

    setStatus(
      `Готово: ${parsed.headers.length} заголовков, ` +
      `${parsed.instructions.size} инструкций`,
      "success"
    );
  } catch (error) {
    console.error(error);
    setStatus(error.message, "error");
  } finally {
    fileInput.value = "";
  }
});

compileButton.addEventListener("click", () => {
  try {
    setStatus("Компиляция...");
    const binary = compile(editor.value);
    download(binary, "iscript.bin");

    setStatus(
      `Скомпилировано: ${binary.length} байт`,
      "success"
    );
  } catch (error) {
    console.error(error);
    setStatus(error.message, "error");
  }
});

clearButton.addEventListener("click", () => {
  editor.value = "";
  setStatus("Редактор очищен");
});

editor.addEventListener("keydown", event => {
  if (event.key === "Tab") {
    event.preventDefault();

    const start = editor.selectionStart;
    const end = editor.selectionEnd;

    editor.setRangeText("\t", start, end, "end");
  }

  if ((event.ctrlKey || event.metaKey) && event.key === "s") {
    event.preventDefault();
    compileButton.click();
  }
});
</script>
</body>
